<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Admin Dashboard</span>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">

                    <h3>Total Doctors</h3>

                    <h1 th:text="${doctorCount}">0</h1>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">

                    <h3>Total Patients</h3>

                    <h1 th:text="${patientCount}">0</h1>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">

                    <h3>Appointments</h3>

                    <h1 th:text="${appointmentCount}">0</h1>

                </div>
            </div>
        </div>

    </div>

    <div class="mt-5">

        <a href="/admin/doctors" class="btn btn-primary">
            Manage Doctors
        </a>

        <a href="/admin/patients" class="btn btn-success">
            Manage Patients
        </a>

        <a href="/appointments" class="btn btn-dark">
            View Appointments
        </a>

    </div>

</div>

</body>
</html>
