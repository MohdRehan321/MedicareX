<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4 col-md-5 mx-auto">

        <h3 class="text-center mb-4">Register</h3>

        <form th:action="@{/register}"
              th:object="${user}"
              method="post">

            <div class="mb-3">
                <label>Name</label>

                <input type="text"
                       th:field="*{name}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>

                <input type="email"
                       th:field="*{email}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Password</label>

                <input type="password"
                       th:field="*{password}"
                       class="form-control">
            </div>

            <div class="mb-3">

                <label>Role</label>

                <select th:field="*{role}"
                        class="form-control">

                    <option value="PATIENT">Patient</option>

                    <option value="DOCTOR">Doctor</option>

                </select>

            </div>

            <button type="submit"
                    class="btn btn-success w-100">
                Register
            </button>

        </form>

    </div>

</div>

</body>
</html>
